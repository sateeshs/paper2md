name = "paper2md-arxiv-search-mcp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Secrets (set via: wrangler secret put SUPABASE_URL && wrangler secret put SUPABASE_ANON_KEY)
# SUPABASE_URL
# SUPABASE_ANON_KEY

# Shared bearer token — REQUIRED. The server refuses all MCP requests
# without it (/health stays public). Must match MCP_AUTH_TOKEN in the
# Next.js app's environment.
#   wrangler secret put MCP_AUTH_TOKEN
