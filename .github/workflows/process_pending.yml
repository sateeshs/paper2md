# Batch processing — manual / emergency fallback
#
# The scheduled cron has been replaced by Modal's process_pending_batch()
# function (mcp-servers/paper-processor-mcp/modal_app.py), which runs every
# 6 hours as a Modal Cron job.
#
# This workflow is kept as a manual fallback for:
#   - Environments where Modal is not deployed
#   - Emergency re-processing runs
#   - Single-paper re-triggers from the GitHub UI
#
# The /api/queue route prefers the paper-processor-mcp when
# PAPER_PROCESSOR_MCP_URL is set; it falls back to workflow_dispatch here.

name: Process Pending Papers (manual fallback)

on:
  # Manual trigger from GitHub UI (Actions tab → Run workflow)
  # Also called by /api/queue route when PAPER_PROCESSOR_MCP_URL is not set
  workflow_dispatch:
    inputs:
      arxiv_id:
        description: "Optional: single ArXiv ID to process (e.g. 2301.07984)"
        required: false
        type: string

jobs:
  process:
    name: Process ArXiv papers
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 10 math blocks × ~40s on OpenRouter = ~7 min; 20 min is ample

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process single paper (manual trigger with arxiv_id)
        if: ${{ github.event.inputs.arxiv_id != '' }}
        run: |
          python summarize_papers.py \
            --arxiv-id "${{ github.event.inputs.arxiv_id }}" \
            --push-supabase
        env:
          PAPER2MD_LLM_PROVIDER:     openrouter
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY:        ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAPER2MD_MAX_MATH_BLOCKS:  "10"

      - name: Process all pending papers (manual without arxiv_id)
        if: ${{ github.event.inputs.arxiv_id == '' }}
        run: |
          python summarize_papers.py \
            --process-pending \
            --push-supabase
        env:
          PAPER2MD_LLM_PROVIDER:     openrouter
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY:        ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAPER2MD_MAX_MATH_BLOCKS:  "10"

      - name: Upload failed push journal (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-push-journal
          path: ~/.paper2md/failed_push.json
          if-no-files-found: ignore
          retention-days: 7
